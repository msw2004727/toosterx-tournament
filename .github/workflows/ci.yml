name: CI

on:
  push:
    branches: [main, demo]
  pull_request:
    branches: [main, demo]

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version consistency (config.js / sw.js / index.html / package.json)
        run: node scripts/bump-version.js --check

      # img/*.png 是產物但**有進版控**（PWA 圖示要能被瀏覽器直接抓）。
      # 這一條保證檔案內容與 scripts/make-icons.mjs 沒有分岔——
      # 改了產生器卻忘了重跑，安裝後的圖示就會跟設計不一樣，而且沒有人會發現。
      - name: PWA icons match generator
        run: node scripts/make-icons.mjs --check

      # 這一條原本寫成 grep -rlIz -P 的 NUL 樣式，看起來很對，實測**永遠不會命中**：
      #   -I 把含 NUL 的檔案當成二進位直接跳過，
      #   -z 又把 NUL 當成行分隔符（分隔符不屬於行內容，樣式沒東西可匹配）。
      # 也就是說 R-SRC-001 曾經有一盞紅不起來的綠燈，正是 R-TEST-001 講的那種。
      # 改成 Node 直接讀 bytes，附帶好處是 Windows 上也跑得動。
      - name: No NUL bytes in source files
        run: |
          node -e "
            const fs=require('fs'),path=require('path');
            const EXT=new Set(['.js','.cjs','.mjs','.json','.md','.html','.css','.rules','.yml','.yaml']);
            const SKIP=new Set(['node_modules','.git','coverage','test-results','playwright-report']);
            const bad=[];
            (function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){
              if(SKIP.has(e.name)) continue;
              const p=path.join(d,e.name);
              if(e.isDirectory()) walk(p);
              else if(EXT.has(path.extname(e.name)) && fs.readFileSync(p).includes(0)) bad.push(p);
            }})('.');
            if(bad.length){
              console.error('R-SRC-001: NUL bytes found; git will treat these as binary:');
              console.error(bad.join('\n')); process.exit(1);
            }
            console.log('OK');
          "

      # 主題只能靠 <html data-theme>。CSS 裡一旦冒出 prefers-color-scheme，
      # 使用者選的「淺色」就會在深色系統下被 media query 蓋回去（R-UI-005）。
      # 這裡擋的是 css/**；base.css 的 prefers-reduced-motion 不在此限。
      - name: Theme is driven only by data-theme
        run: |
          node -e "
            const fs=require('fs'),path=require('path');
            const files=[];(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){
              const p=path.join(d,e.name); e.isDirectory()?walk(p):e.name.endsWith('.css')&&files.push(p);}})('css');
            const bad=[];
            for(const f of files){
              // 註解裡提到它是可以的（那是在解釋為什麼不用），實際的 at-rule 才不行
              const src=fs.readFileSync(f,'utf8').replace(/\/\*[\s\S]*?\*\//g,'');
              if(/@media[^{;]*prefers-color-scheme/.test(src)) bad.push(f);
            }
            if(bad.length){
              console.error('R-UI-005: css must not branch on prefers-color-scheme; resolve it into data-theme in js/core/theme.js');
              console.error(bad.join('\n')); process.exit(1);
            }
            if(!fs.readFileSync('css/tokens.css','utf8').includes('[data-theme=\"dark\"]')){
              console.error('css/tokens.css must define the dark palette under [data-theme=\"dark\"]'); process.exit(1);
            }
            console.log('OK');
          "

      # functions/engine 是 js/engine 的複本（R-ENG-001）。同步腳本壞掉的話，
      # 部署上去的會是一份舊引擎，而本機模擬器完全看不出來。
      - name: Engine copy for functions is reproducible
        run: |
          set -e
          node scripts/sync-engine.js
          node scripts/sync-engine.js --check

      - name: Cache headers cover unversioned modules
        run: |
          set -e
          test -f _headers || { echo "_headers is missing; /js/* would be cached for 4h after deploy"; exit 1; }
          grep -q '^/js/\*' _headers || { echo "_headers must cover /js/*"; exit 1; }
          grep -A2 '^/js/\*' _headers | grep -q 'max-age=0' || { echo "/js/* must not be long-cached"; exit 1; }
          # no-cache 是給 Cloudflare zone 改寫 max-age 時的保險（見 _headers 的註解）
          grep -A2 '^/js/\*' _headers | grep -q 'no-cache' || { echo "/js/* must also send no-cache; a zone-level Browser Cache TTL can rewrite max-age"; exit 1; }
          # /img/* 也不能長快取：Pages 對不存在的路徑回 200 + index.html，
          # 長 TTL 會把那份 HTML 當成圖片存起來（2026-09-03 實地發生，見 _headers）
          grep -q '^/img/\*' _headers || { echo "_headers must cover /img/*"; exit 1; }
          grep -A2 '^/img/\*' _headers | grep -q 'max-age=0' || { echo "/img/* must not be long-cached; a missing file is served as 200 + index.html and would be cached as the icon"; exit 1; }
          echo "OK"

      - name: JS syntax check
        run: |
          set -e
          for f in app.js sw.js scripts/*.js scripts/*.cjs scripts/seed/*.js \
                   js/*.js js/core/*.js js/engine/*.js js/lib/*.js js/modules/*/*.js; do
            [ -e "$f" ] || continue
            node --check "$f"
          done
          node --check functions/index.js

  unit-tests:
    name: Unit tests (engine T01-T31 + staff core + theme/icons/undo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit

      # Mutation check: prove the suite can actually detect the defects it
      # is supposed to guard. A green suite with no discriminating power is
      # worse than no suite at all - this job has caught that before.
      - run: node scripts/mutation-check.cjs

  e2e-tests:
    name: E2E (staff console, offline queue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  functions-tests:
    name: Functions pipeline (F01-F13 + mutation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test:fn

      # 同一套鑑別力要求：fail-closed 的程式碼在 happy path 上跟 fail-open
      # 長得一模一樣，只有變異測試分得出來。
      - run: npm run test:mutation:fn

  rules-tests:
    name: Firestore rules (R01-R64 + mutation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test:rules

      # 權限規則是最容易寫出「假守衛」的地方：放寬一條線，happy path 完全不受
      # 影響，測試照樣全綠。每一條邊界都要反向驗證一次。
      - run: npm run test:mutation:rules
