<script>
/* 首屏主題｜必須是同步 inline，而且要在 CSS 之前。
   放到模組裡就會先閃一下淺色再變深色（模組是 defer 的）。
   ⚠️ 這裡的 'feda_theme' 與解析規則必須跟 js/core/theme.js 一致，
      tests/unit/theme.test.js 有一條案例會讀這個檔案對照。 */
(function () {
  try {
    var pref = null;
    try { pref = localStorage.getItem('feda_theme'); } catch (e) {}
    var resolved = (pref === 'light' || pref === 'dark')
      ? pref
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = resolved;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0C1210' : '#F1F5F3');
  } catch (e) { /* 出錯就維持 CSS 的淺色預設，不能因此擋住整頁 */ }
})();
</script>
<script>
/* 攔截安裝提示｜必須是同步 inline，而且要早。
   Chrome 的 beforeinstallprompt 在首次繪製前後就派發，那時候 app.js
   （type=module，等同 defer）連載都還沒載。錯過這一次就再也收不到，
   「安裝」按鈕會永遠不出現——而且完全不會報錯。
   ⚠️ 這裡的 window.__fedaInstall 形狀必須跟 js/core/install.js 一致，
      tests/unit/install.test.js 有一條案例會讀這個檔案對照。 */
(function () {
  window.__fedaInstall = { deferred: null, installed: false };
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__fedaInstall.deferred = e;
  });
  window.addEventListener('appinstalled', function () {
    window.__fedaInstall.installed = true;
    window.__fedaInstall.deferred = null;
  });
})();
</script>
